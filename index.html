<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Spirit Tactics</title>
<style>
:root{--bg:#121621;--pn:#1d2331;--pn2:#2a3243;--ln:#3a4458;--tx:#e8ecf3;--mut:#98a3b7;--ac:#7fd6ff;--gd:#f2c85b;--rd:#ff6b6b;--gn:#7be08a;--pu:#c79bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;position:relative}
#top{display:flex;gap:6px;padding:8px;align-items:center;background:var(--pn);border-bottom:1px solid var(--ln);font-size:12px;flex-wrap:wrap}
.chip{background:var(--pn2);padding:4px 8px;border-radius:12px;white-space:nowrap}
.chip b{color:var(--gd)}
#top .sp{flex:1}
#wrap{flex:1;min-height:0;position:relative}
#cv{display:block;width:100%;height:100%;touch-action:none}
#zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:34px;height:34px;border-radius:50%;padding:0;font-size:18px}
#panel{background:var(--pn);border-top:1px solid var(--ln);padding:8px 10px 12px;height:min(270px,40vh);flex:none;overflow-y:auto}
button{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer}
button:active{transform:translateY(1px)}
button:disabled{opacity:.38;cursor:default}
button.pri{background:#2f5d7a;border-color:#4b89b0}
button.warn{background:#5a2f3a;border-color:#8a4656}
button.on{border-color:var(--gd);color:var(--gd)}
.gd{color:var(--gd)}
.speech{background:#fff;color:#222;border-radius:10px;padding:7px 10px;font-size:12px;margin-bottom:10px}
.ibox{width:38px;height:38px;border-radius:8px;background:#141a26;flex:none;display:flex;align-items:center;justify-content:center}
.detail{background:#161c28;border:1px solid var(--ln);border-top:none;border-radius:0 0 10px 10px;padding:8px;margin-top:-4px}
.who{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln);font-size:12px}
.who i{width:22px;height:22px;border-radius:50%;flex:none}
button.gold{background:#5b4a1f;border-color:#a3873a}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hd .nm{font-weight:700;font-size:15px}
.ttl{color:var(--gd);font-size:12px}
.mut{color:var(--mut);font-size:12px}
.bar{height:7px;background:#0d1018;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%}
.bars{display:grid;grid-template-columns:28px 1fr 64px;gap:2px 6px;align-items:center;font-size:11px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px;font-size:11px;text-align:center}
.stats div{background:var(--pn2);border-radius:6px;padding:3px 0}
.stats b{display:block;font-size:13px}
.up{color:var(--gn)}.dn{color:var(--rd)}
.hint{background:#16304a;border:1px solid #2c5a80;border-radius:8px;padding:6px 8px;font-size:12px;margin-top:6px}
#sheet{position:absolute;inset:0;background:rgba(6,8,14,.72);display:none;align-items:flex-end;z-index:5}
#sheet.on{display:flex}
#sheet .in{background:var(--pn);width:100%;max-height:92%;overflow-y:auto;border-radius:14px 14px 0 0;padding:12px;border-top:1px solid var(--ln)}
.card{display:flex;gap:10px;align-items:center;background:var(--pn2);border:1px solid var(--ln);border-radius:10px;padding:8px;margin-top:6px}
.card.off{opacity:.4}
.card .ic{width:36px;height:36px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.25)}
.card .tx{flex:1;min-width:0}
h2{margin:0 0 4px;font-size:18px}
#ov{position:absolute;inset:0;background:rgba(6,8,14,.82);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
#ov.on{display:flex}
#ov .in{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:16px;max-width:420px;width:100%;max-height:90%;overflow-y:auto}
#ov p{margin:6px 0}
#dock{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
#dock button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;font-size:12px}
#dock button i{width:20px;height:20px;border-radius:50%;display:block}
#dock button.near{border-color:var(--gd)}
.clbl{font:600 11px system-ui;fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3px}
#log{font-size:11px;color:var(--mut);margin-top:8px;max-height:48px;overflow:hidden}
</style>
</head>
<body>
<div id="app">
  <div id="top"></div>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="zoom"><button id="zi">+</button><button id="zo">−</button><button id="zc" title="Center">◎</button></div>
    <div id="chart" style="position:absolute;inset:0;display:none;z-index:4;background:#173a5a"></div>
  </div>
  <div id="panel"></div>
  <div id="sheet"><div class="in" id="sheetIn"></div></div>
  <div id="ov"><div class="in" id="ovIn"></div></div>
</div>
<script>
'use strict';
// ===================== DATA =====================
// Vertical squash for the 2.5D view.
const VS = 0.62;
// Battlefield outline (world units). Anything outside is out of bounds.
const ISLAND1 = [[60,120],[160,50],[300,40],[430,70],[520,150],[540,280],[500,400],[400,470],[260,490],[130,450],[60,350],[40,230]];
const CONF_RANGE = 130, REACH = 34;

// Object types. mods = % changes a spirit gets when confined into it; turns = how long it can stay.
const OT = {
  rock:   {n:'Rock',      mods:{def:.30,res:.10,spd:-.15},         turns:6, w:30, r:13},
  tree:   {n:'Old Tree',  mods:{hp:.25,atk:.10,mv:-.25},           turns:5, w:60, r:15},
  flower: {n:'Moonbloom', mods:{int:.30,res:.25,hp:-.20},          turns:3, w:2,  r:8},
  barrel: {n:'Barrel',    mods:{atk:.20,def:-.10,mv:.10},          turns:4, w:15, r:11},
  sword:  {n:'Iron Blade',mods:{atk:.25},  turns:4, w:6, r:9,  equip:{atk:14},       skill:'slash'},
  bow:    {n:'Ash Bow',   mods:{spd:.20,mv:.10}, turns:4, w:5, r:9, equip:{atk:8,spd:6}, skill:'arrow'},
  axe:    {n:'Woodcutter Axe',mods:{atk:.30,spd:-.10}, turns:4, w:9, r:9, equip:{atk:20,spd:-4}, skill:'chop'},
  spear:  {n:'Reed Spear', mods:{atk:.15,mv:.10}, turns:4, w:7, r:9, equip:{atk:12}, skill:'pierce'},
  staff:  {n:'Oak Staff', mods:{int:.25},  turns:3, w:5, r:9,  equip:{int:14},       skill:'bolt'},
};
// Titles: % stat changes. Any unit or object can carry one.
const TT = {
  '':{}, Sturdy:{def:.2,res:.1}, Fierce:{atk:.2}, Swift:{spd:.25,mv:.15}, Sage:{int:.25},
  Hardy:{hp:.25}, Elder:{hp:.1,atk:.1,def:.1,int:.1,res:.1,spd:.1}, Frail:{hp:-.15,def:-.15},
  Thief:{spd:.15}, Champion:{atk:.3,hp:.2},
};
const STATS = ['hp','atk','def','int','res','spd','mv'];
const SL = {hp:'HP',atk:'ATK',def:'DEF',int:'INT',res:'RES',spd:'SPD',mv:'MOV'};

// Classes. b = base stats at level 1 (mv in world units).
const CL = {
  Warden:  {b:{hp:62,atk:8, def:8, int:10,res:10,spd:9, mv:85}, sk:['punch'],        col:'#f0d27a', w:18},
  Soldier: {b:{hp:70,atk:16,def:12,int:4, res:6, spd:9, mv:80}, sk:['punch','cleave'],col:'#8fb3ff'},
  Archer:  {b:{hp:50,atk:13,def:7, int:6, res:8, spd:12,mv:85}, sk:['punch','arrow'], col:'#8fe3a0'},
  Witch:   {b:{hp:42,atk:5, def:5, int:17,res:13,spd:10,mv:75}, sk:['bolt','frost'],  col:'#c79bff'},
  Healer:  {b:{hp:48,atk:6, def:7, int:14,res:15,spd:9, mv:80}, sk:['punch','heal'],  col:'#f4f1e6'},
  Rogue:   {b:{hp:48,atk:11,def:7, int:6, res:7, spd:16,mv:105},sk:['punch','steal'], col:'#ffb070'},
  Mossling:{b:{hp:46,atk:12,def:9, int:4, res:6, spd:8, mv:70}, sk:['punch'],        col:'#6fbf5a'},
  Thornbat:{b:{hp:32,atk:11,def:5, int:6, res:7, spd:14,mv:110},sk:['spit'],         col:'#9a6bd0'},
  Hexcap:  {b:{hp:40,atk:6, def:6, int:15,res:12,spd:9, mv:65}, sk:['hex'],          col:'#d0605a'},
  GrubKnight:{b:{hp:95,atk:15,def:13,int:5,res:9, spd:7, mv:65}, sk:['punch','cleave'],col:'#a07850', w:60, r:16},
};
// Skills. pow multiplies ATK (phys) or INT (mag). kb = knockback distance.
const SK = {
  punch: {n:'Punch',     t:'phys',pow:1.0,rng:32, sp:0, kb:10},
  cleave:{n:'Cleave',    t:'phys',pow:1.5,rng:36, sp:4, kb:45},
  slash: {n:'Slash',     t:'phys',pow:1.3,rng:36, sp:0, kb:15},
  arrow: {n:'Arrow',     t:'phys',pow:1.0,rng:150,sp:0, kb:0, proj:'#d8c79a'},
  spit:  {n:'Thorn Spit',t:'phys',pow:0.9,rng:120,sp:0, kb:0, proj:'#9ad06b'},
  bolt:  {n:'Bolt',      t:'mag', pow:1.3,rng:120,sp:3, kb:0, proj:'#ffe27a'},
  hex:   {n:'Hex',       t:'mag', pow:1.0,rng:100,sp:2, kb:0, proj:'#ff7a7a'},
  frost: {n:'Frost Ring',t:'mag', pow:1.0,rng:100,sp:6, kb:0, aoe:45},
  heal:  {n:'Mend',      t:'heal',pow:1.4,rng:100,sp:3},
  chop:  {n:'Chop',      t:'phys',pow:1.6,rng:34, sp:2, kb:25},
  pierce:{n:'Pierce',    t:'phys',pow:1.1,rng:60, sp:2, kb:0, line:1},
  steal: {n:'Steal',     t:'steal',rng:32,sp:2},
};

let ISLAND = ISLAND1;
let STAGE;
// Spirits you can confine this battle: your island roster (set in newBattle).
let ROSTER = [];
const STAGE1 = {
  name:'Mossy Hollow', conf:6, reward:600,
  host:{name:'Wren',cls:'Warden',lv:3,x:140,y:340},
  objs:[['tree',105,230,'Hardy'],['rock',180,270,'Sturdy'],['barrel',225,330,'Fierce'],['flower',190,410,'Sage'],
        ['flower',110,400],['rock',250,420],['tree',230,170],['bow',150,300],['sword',280,280,'Swift'],
        ['rock',330,190],['flower',300,350],['barrel',340,420],['tree',410,300,'Elder']],
  foes:[{name:'Mossling',cls:'Mossling',lv:3,x:400,y:180},{name:'Mossling',cls:'Mossling',lv:3,x:430,y:400},
        {name:'Mossling',cls:'Mossling',lv:4,x:470,y:260,title:'Fierce'},{name:'Thornbat',cls:'Thornbat',lv:3,x:480,y:170},
        {name:'Thornbat',cls:'Thornbat',lv:3,x:380,y:440},
        {name:'Hexcap',cls:'Hexcap',lv:4,x:490,y:330,held:'staff',heldTitle:'Elder'},
        {name:'Grub Knight',cls:'GrubKnight',lv:5,x:500,y:240,title:'Champion',held:'sword',heldTitle:'Fierce',boss:1}],
};

// ===================== HELPERS =====================
const $ = s => document.querySelector(s);
const dist = (a,b,c,d) => Math.hypot(a-c,b-d);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const FAST = /fast/.test(location.search) ? 0.05 : 1;
const wait = ms => new Promise(r => setTimeout(r, ms*FAST));
function pip(x,y,poly=ISLAND){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
function inIsland(x,y,m=0){if(!pip(x,y))return false;if(!m)return true;for(let a=0;a<6.28;a+=0.785)if(!pip(x+Math.cos(a)*m,y+Math.sin(a)*m))return false;return true}
const pct = v => (v>0?'+':'')+Math.round(v*100)+'%';

// ===================== STATE =====================
let G, ents, uid = 1, busy = false;
const fx = [];
const units = t => ents.filter(e => e.k==='unit' && (!t || e.team===t));
const objs = () => ents.filter(e => e.k==='obj');
const host = () => ents.find(e => e.host);

function mkObj(type,x,y,title=''){const o=OT[type];return {k:'obj',id:uid++,type,x,y,title,liftedBy:null,r:o.r,w:o.w}}
function mkUnit(o){
  const c = CL[o.cls], lvm = 1+(o.lv-1)*0.12, b = {};
  for (const k of STATS) b[k] = k==='mv' ? c.b[k] : Math.round(c.b[k]*lvm);
  const u = {k:'unit',id:uid++,team:o.team,name:o.name,cls:o.cls,lv:o.lv,b,title:o.title||'',x:o.x||0,y:o.y||0,
    held:o.held?mkObj(o.held,0,0,o.heldTitle):null,lift:null,liftedBy:null,obj:null,turns:0,mvLeft:0,acted:false,
    host:!!o.host,boss:!!o.boss,r:c.r||12,w:c.w||20};
  u.hp = stat(u,'hp'); u.sp = maxSP(u); return u;
}
// Final stat: base × (1 + object mods + object title + own title + held item title) + held item flat bonus.
function statParts(u,k){
  let m = 0;
  if (u.obj) m += (OT[u.obj.type].mods[k]||0) + (TT[u.obj.title][k]||0);
  m += TT[u.title][k]||0;
  if (u.held) m += TT[u.held.title][k]||0;
  const flat = u.held ? (OT[u.held.type].equip?.[k]||0) : 0;
  return {m, flat};
}
function stat(u,k){const {m,flat}=statParts(u,k);return Math.max(1,Math.round(u.b[k]*(1+m)+flat))}
const maxSP = u => 6 + Math.round(stat(u,'int')*0.6);
function skills(u){const s=[...CL[u.cls].sk];if(u.held&&OT[u.held.type].skill&&!s.includes(OT[u.held.type].skill))s.push(OT[u.held.type].skill);return s}
const alive = u => ents.includes(u);
// Unit from a saved character (roster entry or the Warden); its item comes along.
function charUnit(c,extra){const u=mkUnit({...c,held:c.item?.type,heldTitle:c.item?.title,...extra});u.rid=c.id;return u}

function newBattle(st=STAGES[0]){
  STAGE = st; ISLAND = st.island; DECOR = mkDecor();
  uid = 1; fx.length = 0;
  ents = [];
  ROSTER = SAVE.roster;
  const h = charUnit(SAVE.host,{x:STAGE.host.x,y:STAGE.host.y,team:'p',host:1});
  ents.push(h);
  for (const [t,x,y,ti] of STAGE.objs) ents.push(mkObj(t,x,y,ti||''));
  for (const f of STAGE.foes) ents.push(mkUnit({...f,team:'e'}));
  G = {turn:0,phase:'player',confLeft:STAGE.conf,used:{},sel:null,mode:'idle',pending:null,over:null,
       stats:{confined:0,ob:0,stolen:0,defeated:0},log:[],exp:{},expDone:0,ups:[]};
  cam.x = h.x+90; cam.y = h.y-40; camT = null;
  $('#ov').classList.remove('on');
  startPlayerPhase();
}
function log(s){G.log.unshift(s);G.log.length=Math.min(G.log.length,6)}

// ===================== CAMERA / INPUT =====================
const cv = $('#cv'), cx = cv.getContext('2d');
let cw=0, ch=0, dpr=1;
const cam = {x:290,y:280,z:1}; let camT = null;
function resize(){dpr=devicePixelRatio||1;const r=cv.getBoundingClientRect();cw=r.width;ch=r.height;cv.width=cw*dpr;cv.height=ch*dpr;cam.z=clamp(cw/340,0.8,1.6)}
const w2s = (x,y,h=0) => [(x-cam.x)*cam.z+cw/2, ((y-cam.y)*VS-h)*cam.z+ch/2];
const s2w = (sx,sy) => [(sx-cw/2)/cam.z+cam.x, (sy-ch/2)/cam.z/VS+cam.y];
function focus(e){camT={x:e.x,y:e.y}}

let pd = null;
cv.addEventListener('pointerdown', e => {if(MODE==='hub')return hubPtr('down',e);pd={x:e.clientX,y:e.clientY,moved:false};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove', e => {
  if (MODE==='hub') return hubPtr('move',e);
  if (!pd) return;
  const dx=e.clientX-pd.x, dy=e.clientY-pd.y;
  if (!pd.moved && Math.hypot(dx,dy)<8) return;
  pd.moved = true; camT = null;
  cam.x -= dx/cam.z; cam.y -= dy/cam.z/VS; pd.x=e.clientX; pd.y=e.clientY;
});
cv.addEventListener('pointerup', e => {
  if (MODE==='hub') return hubPtr('up',e);
  if (pd && !pd.moved){const r=cv.getBoundingClientRect();tap(e.clientX-r.left,e.clientY-r.top)}
  pd = null;
});
cv.addEventListener('wheel', e => {e.preventDefault();cam.z=clamp(cam.z*(e.deltaY<0?1.1:0.9),0.5,2.5)},{passive:false});
$('#zi').onclick = () => cam.z = clamp(cam.z*1.2,0.5,2.5);
$('#zo').onclick = () => cam.z = clamp(cam.z/1.2,0.5,2.5);
$('#zc').onclick = () => {const s=G.sel||host();if(s)focus(s)};

// Entity under a world point. Units are drawn standing up, so also test above their feet.
function pick(wx,wy){
  let best=null, bd=1e9;
  for (const e of ents){
    if (e.liftedBy) continue;
    const d = Math.min(dist(wx,wy,e.x,e.y), e.k==='unit' ? dist(wx,wy,e.x,e.y-26) : 1e9);
    if (d < e.r+10 && d < bd){bd=d;best=e}
  }
  return best;
}
function findFree(x,y,self,m=8){
  const ok=(px,py)=>inIsland(px,py,m)&&!ents.some(o=>o!==self&&!o.liftedBy&&o!==self?.lift&&dist(px,py,o.x,o.y)<(o.r+(self?.r||12))*0.8);
  if (ok(x,y)) return [x,y];
  for (let r=8;r<=60;r+=8) for (let a=0;a<6.28;a+=0.5){const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;if(ok(px,py))return [px,py]}
  return null;
}

// ===================== ANIMATION =====================
const anims = [];
function tween(ms,f){return new Promise(res=>{anims.push({t0:performance.now(),ms:Math.max(1,ms*FAST),f,res})})}
function popup(x,y,s,col='#fff'){fx.push({type:'txt',x,y,s,col,t0:performance.now(),ms:1000*Math.max(FAST,.3)})}
async function banner(s){G.banner={s,t0:performance.now()};await wait(900);G.banner=null}

// ===================== PHASES =====================
function startPlayerPhase(){
  G.phase='player'; G.turn++;
  for (const u of units('p')){
    if (!u.host && G.turn>1){
      u.turns--;
      if (u.turns<=0){removeUnit(u,'returned to the spirit realm');continue}
    }
    u.mvLeft = stat(u,'mv'); u.acted = false;
  }
  G.sel=null; G.mode='idle'; G.pending=null;
  banner('Turn '+G.turn+' · Your Phase');
  ui();
}
async function enemyPhase(){
  G.phase='enemy'; G.sel=null; G.mode='idle'; G.pending=null; busy=true; ui();
  await banner('Enemy Phase');
  for (const e of units('e')){
    if (!alive(e) || G.over) continue;
    e.mvLeft = stat(e,'mv'); e.acted = false;
    if (e.liftedBy) continue;
    focus(e); await wait(250);
    await aiAct(e);
    if (checkEnd()) {busy=false;ui();return}
  }
  busy=false;
  startPlayerPhase();
  const h=host(); if(h) focus(h);
}
function bestAttack(e,sks,targets,x,y){
  for (const s of sks) {
    const inR = targets.filter(t => dist(x,y,t.x,t.y) <= s.rng+t.r).sort((a,b)=>a.hp-b.hp);
    if (inR.length) return {s,t:inR[0]};
  }
  return null;
}
async function aiAct(e){
  const targets = units('p').filter(u=>!u.liftedBy);
  if (!targets.length) return;
  const sks = skills(e).map(k=>({k,...SK[k]})).filter(s=>s.t==='phys'||s.t==='mag').filter(s=>e.sp>=s.sp).sort((a,b)=>b.pow-a.pow);
  let plan = bestAttack(e,sks,targets,e.x,e.y);
  if (!plan){
    const t = targets.slice().sort((a,b)=>dist(e.x,e.y,a.x,a.y)-dist(e.x,e.y,b.x,b.y))[0];
    const d = dist(e.x,e.y,t.x,t.y), maxR = Math.max(...sks.map(s=>s.rng));
    const step = Math.min(e.mvLeft, Math.max(0,d-maxR*0.8));
    if (step>3){
      const p = findFree(e.x+(t.x-e.x)/d*step, e.y+(t.y-e.y)/d*step, e);
      if (p && dist(e.x,e.y,p[0],p[1]) <= e.mvLeft+10) await moveTo(e,p[0],p[1]);
    }
    plan = bestAttack(e,sks,targets,e.x,e.y);
  }
  if (plan) await useSkill(e,plan.s.k,plan.t.x,plan.t.y,plan.t);
}
function checkEnd(){
  if (G.over) return true;
  if (!host()) {G.over='lose';showEnd();return true}
  if (!units('e').length) {G.over='win';showEnd();return true}
  return false;
}

// ===================== ACTIONS =====================
async function moveTo(u,x,y){
  const x0=u.x,y0=u.y,d=dist(x0,y0,x,y);
  await tween(180+d*2.2, t=>{u.x=x0+(x-x0)*t;u.y=y0+(y-y0)*t;if(u.lift){u.lift.x=u.x;u.lift.y=u.y}});
  u.mvLeft = Math.max(0,u.mvLeft-d);
}
function removeUnit(u,why){
  const i = ents.indexOf(u); if (i<0) return;
  ents.splice(i,1);
  if (u.liftedBy){u.liftedBy.lift=null;u.liftedBy=null}
  if (u.lift){const l=u.lift;l.liftedBy=null;u.lift=null;const p=findFree(u.x,u.y,l);if(p){l.x=p[0];l.y=p[1]}else if(l.k==='unit')removeUnit(l,'was lost');else ents.splice(ents.indexOf(l),1)}
  if (u.held){const it=u.held;u.held=null;const p=findFree(u.x+10,u.y+6,it);if(p){it.x=p[0];it.y=p[1];ents.push(it);log(OT[it.type].n+' dropped')}}
  if (why) log(u.name+' '+why);
  if (G.sel===u) G.sel=null;
}
function damage(u,n,src){
  u.hp = Math.max(0,u.hp-n);
  popup(u.x,u.y,String(n),'#ffd0d0');
  if (u.hp<=0){
    popup(u.x,u.y-10, u.team==='e'?'Defeated':(u.host?'Down!':'Vanished'), '#ff8080');
    if (u.team==='e'){G.stats.defeated++;giveExp(src,u)}
    removeUnit(u, u.team==='e'?'was defeated':(u.host?'fell!':'vanished'));
  }
}
async function knock(u,fromX,fromY,kb,src){
  if (!kb || !alive(u)) return;
  const d = dist(fromX,fromY,u.x,u.y)||1, nx=u.x+(u.x-fromX)/d*kb, ny=u.y+(u.y-fromY)/d*kb;
  const x0=u.x,y0=u.y;
  if (!inIsland(nx,ny)){
    await tween(260,t=>{u.x=x0+(nx-x0)*t;u.y=y0+(ny-y0)*t});
    await fallOut(u,src); return;
  }
  const p = findFree(nx,ny,u,0) || [x0,y0];
  await tween(200,t=>{u.x=x0+(p[0]-x0)*t;u.y=y0+(p[1]-y0)*t});
}
async function fallOut(e,src){
  popup(e.x,e.y,'OUT OF BOUNDS!','#ffcf5b');
  e.falling = 0;
  await tween(500,t=>{e.falling=t});
  if (e.k==='unit'){
    if (e.team==='e'){G.stats.ob++;G.stats.defeated++;giveExp(src,e)}
    if (e.host){e.hp=0}
    removeUnit(e,'fell out of bounds');
  } else { ents.splice(ents.indexOf(e),1); log(OT[e.type].n+' fell out of bounds') }
}
function calcDmg(a,d,s){
  const [A,D] = s.t==='mag' ? [stat(a,'int'),stat(d,'res')] : [stat(a,'atk'),stat(d,'def')];
  return Math.max(1, Math.round((A*s.pow*1.6 - D*0.8)*(0.9+Math.random()*0.2)));
}
const hitChance = (a,d) => clamp(90+(stat(a,'spd')-stat(d,'spd'))*2,50,100);
const stealChance = (a,d) => clamp(40+(stat(a,'spd')-stat(d,'spd'))*3+(a.title==='Thief'?20:0),10,95);

async function useSkill(u,k,tx,ty,target){
  const s = SK[k];
  u.sp -= s.sp; u.acted = true;
  log(u.name+' used '+s.n);
  // Visual: lunge for melee, projectile for ranged
  if (s.proj){
    const p={type:'proj',x0:u.x,y0:u.y,x1:tx,y1:ty,col:s.proj,t:0};fx.push(p);
    await tween(160+dist(u.x,u.y,tx,ty)*1.4,t=>p.t=t); fx.splice(fx.indexOf(p),1);
  } else if (s.aoe){
    const p={type:'ring',x:tx,y:ty,r:s.aoe,t:0};fx.push(p);await tween(400,t=>p.t=t);fx.splice(fx.indexOf(p),1);
  } else if (target){
    const x0=u.x,y0=u.y,dx=(target.x-x0)*0.35,dy=(target.y-y0)*0.35;
    await tween(220,t=>{const f=Math.sin(t*Math.PI);u.x=x0+dx*f;u.y=y0+dy*f}); u.x=x0;u.y=y0;
  }
  const hits = s.line ? lineHits(u,tx,ty,s.rng) : s.aoe ? units().filter(e=>e!==u&&!e.liftedBy&&dist(tx,ty,e.x,e.y)<=s.aoe+e.r) : (target&&alive(target)?[target]:[]);
  for (const t of hits){
    if (s.t==='heal'){
      const n = Math.round(stat(u,'int')*s.pow*1.2); t.hp=Math.min(stat(t,'hp'),t.hp+n); popup(t.x,t.y,'+'+n,'#8dffa0');
    } else if (s.t==='steal'){
      if (!t.held){popup(t.x,t.y,'Nothing to steal','#ccc');continue}
      if (Math.random()*100 < stealChance(u,t)){
        const it=t.held; t.held=null; t.hp=Math.min(t.hp,stat(t,'hp'));
        if (!u.held){u.held=it}else{const p=findFree(u.x+14,u.y,it);if(p){it.x=p[0];it.y=p[1];ents.push(it)}}
        G.stats.stolen++; popup(t.x,t.y,'Stole '+OT[it.type].n+'!','#ffcf5b'); log(u.name+' stole '+(it.title?it.title+' ':'')+OT[it.type].n);
      } else popup(t.x,t.y,'Steal failed','#ccc');
    } else {
      if (s.t==='phys' && Math.random()*100 > hitChance(u,t)){popup(t.x,t.y,'Miss','#ccc');continue}
      damage(t,calcDmg(u,t,s),u);
      if (alive(t)) await knock(t,u.x,u.y,s.kb,u);
    }
  }
  await wait(250);
}
function canLift(u,e){
  if (e===u||e.liftedBy||e.lift||u.lift) return false;
  return e.w <= stat(u,'atk')*2.5;
}
const throwRange = u => 60+stat(u,'atk')*4;
async function throwAt(u,x,y){
  const e=u.lift, x0=u.x, y0=u.y; u.acted=true;
  e.liftedBy=null; u.lift=null; e.air=30;
  const d=dist(x0,y0,x,y);
  await tween(250+d*1.6,t=>{e.x=x0+(x-x0)*t;e.y=y0+(y-y0)*t;e.air=30*(1-t)+Math.sin(t*Math.PI)*40});
  e.air=0;
  log(u.name+' threw '+(e.name||OT[e.type].n));
  if (!inIsland(x,y)){await fallOut(e,u);return}
  // Landing on someone hurts them.
  for (const v of units()) if (v!==e && dist(v.x,v.y,x,y)<v.r+e.r*0.7){damage(v,Math.round(5+e.w*0.4),u)}
  if (e.k==='unit' && alive(e)) damage(e,Math.max(1,Math.round(stat(e,'hp')*0.08)),u);
  if (ents.includes(e)){const p=findFree(x,y,e,0);if(p){e.x=p[0];e.y=p[1]}}
}
function confine(sp,obj){
  const u = charUnit(sp,{team:'p',x:obj.x,y:obj.y});
  u.obj = obj; u.hp = stat(u,'hp'); u.sp = maxSP(u);
  u.turns = OT[obj.type].turns + (obj.title==='Elder'?1:0);
  u.r = 12; u.mvLeft = stat(u,'mv'); u.acted=false;
  ents.splice(ents.indexOf(obj),1); ents.push(u);
  G.used[sp.id]=1; G.confLeft--; G.stats.confined++;
  popup(u.x,u.y,'Confined!','#a8e6ff');
  log(sp.name+' confined into '+(obj.title?obj.title+' ':'')+OT[obj.type].n);
  return u;
}

// ===================== TAP HANDLING =====================
function tap(sx,sy){
  if (busy || G.over || G.phase!=='player') return;
  const [wx,wy] = s2w(sx,sy), hit = pick(wx,wy), u = G.sel;
  const mode = G.mode;
  if (mode==='move'){
    if (dist(u.x,u.y,wx,wy) > u.mvLeft+1) return flash('Too far');
    const p = findFree(wx,wy,u,6);
    if (!p || dist(p[0],p[1],wx,wy)>16 || dist(u.x,u.y,p[0],p[1])>u.mvLeft+1) return flash("Can't stand there");
    G.mode='idle'; act(()=>moveTo(u,p[0],p[1]));
  } else if (mode==='skill'){
    const s=SK[G.skill];
    if (s.aoe){
      if (dist(u.x,u.y,wx,wy)>s.rng) return flash('Out of range');
      G.mode='idle'; act(()=>useSkill(u,G.skill,wx,wy,null));
    } else {
      if (!hit || hit.k!=='unit' || hit===u) return flash('Tap a unit');
      if (dist(u.x,u.y,hit.x,hit.y)>s.rng+hit.r) return flash('Out of range');
      if (s.t==='steal' && !hit.held) return flash('Nothing to steal');
      G.mode='idle'; act(()=>useSkill(u,G.skill,hit.x,hit.y,hit));
    }
  } else if (mode==='lift'){
    if (!hit || hit===u) return flash('Tap something next to you');
    if (dist(u.x,u.y,hit.x,hit.y)>REACH+hit.r) return flash('Too far');
    if (!canLift(u,hit)) return flash('Too heavy');
    u.lift=hit; hit.liftedBy=u; hit.x=u.x; hit.y=u.y; G.mode='idle'; log(u.name+' lifted '+(hit.name||OT[hit.type].n)); ui();
  } else if (mode==='throw'){
    if (dist(u.x,u.y,wx,wy)>throwRange(u)) return flash('Too far');
    G.mode='idle'; act(()=>throwAt(u,wx,wy));
  } else if (mode==='equip'){
    if (!hit || hit.k!=='obj' || !OT[hit.type].equip) return flash('Tap a weapon');
    if (dist(u.x,u.y,hit.x,hit.y)>REACH+hit.r) return flash('Too far');
    ents.splice(ents.indexOf(hit),1);
    if (u.held){const it=u.held;const p=findFree(u.x+12,u.y+4,it);it.x=p?p[0]:u.x;it.y=p?p[1]:u.y;ents.push(it)}
    u.held=hit; u.sp=Math.min(u.sp,maxSP(u)); G.mode='idle'; log(u.name+' equipped '+OT[hit.type].n); ui();
  } else if (mode==='useItem'){
    if (!hit || hit.k!=='unit' || hit.team!=='p') return flash('Tap yourself or an ally');
    if (hit!==u && dist(u.x,u.y,hit.x,hit.y)>REACH+hit.r+10) return flash('Too far');
    G.mode='idle'; act(()=>useItem(u,hit,G.useKey));
  } else if (mode==='confObj'){
    const h=host();
    if (!hit || hit.k!=='obj') return flash('Tap an object');
    if (dist(h.x,h.y,hit.x,hit.y)>CONF_RANGE) return flash('Out of confine range');
    G.pending=hit; ui();
  } else {
    G.sel = hit; G.pending=null; ui();
  }
}
let flashT;
function flash(s){G.flash=s;ui();clearTimeout(flashT);flashT=setTimeout(()=>{G.flash=null;ui()},1400)}
async function act(fn){if(busy)return;busy=true;ui();try{await fn()}finally{busy=false;checkEnd();ui()}}

// ===================== UI =====================
function bar(lbl,v,m,col){return `<span>${lbl}</span><div class="bar"><i style="width:${clamp(v/m*100,0,100)}%;background:${col}"></i></div><span>${Math.round(v)}/${m}</span>`}
function statGrid(u,preview){
  return '<div class="stats">'+['atk','def','int','res','spd','mv'].map(k=>{
    const {m}=statParts(u,k), v=stat(u,k), c=m>0.001?'up':m<-0.001?'dn':'';
    return `<div><span class="mut">${SL[k]}</span><b class="${c}">${v}</b></div>`}).join('')+'</div>';
}
function modList(o){return Object.entries(o).filter(([,v])=>v).map(([k,v])=>`<span class="${v>0?'up':'dn'}">${SL[k]} ${pct(v)}</span>`).join(' · ')||'<span class="mut">none</span>'}
function unitInfo(u){
  const t=[`<div class="hd"><span class="nm">${u.name}</span><span class="mut">Lv ${u.lv} ${u.cls==='GrubKnight'?'Grub Knight':u.cls}</span>${u.title?`<span class="ttl">★ ${u.title}</span>`:''}</div>`];
  t.push('<div class="bars">'+bar('HP',u.hp,stat(u,'hp'),u.team==='e'?'#e06060':'#6fd38a')+bar('SP',u.sp,maxSP(u),'#6fa8ff')+'</div>');
  t.push(statGrid(u));
  const bits=[];
  if (u.obj) bits.push(`In <b>${u.obj.title?u.obj.title+' ':''}${OT[u.obj.type].n}</b> · <b style="color:var(--ac)">${u.turns}</b> turn${u.turns===1?'':'s'} left`);
  if (u.held) bits.push(`Holding <b>${u.held.title?u.held.title+' ':''}${OT[u.held.type].n}</b>`);
  if (u.lift) bits.push(`Carrying ${u.lift.name||OT[u.lift.type].n}`);
  if (u.liftedBy) bits.push(`Being carried by ${u.liftedBy.name}`);
  if (bits.length) t.push(`<div class="mut" style="margin-top:6px">${bits.join(' · ')}</div>`);
  return t.join('');
}
function objInfo(o){
  const d=OT[o.type];
  return `<div class="hd"><span class="nm">${d.n}</span>${o.title?`<span class="ttl">★ ${o.title}</span>`:''}<span class="mut">Weight ${d.w}</span></div>
  <div style="margin-top:6px;font-size:12px">Confine bonus: ${modList(d.mods)}</div>
  ${o.title?`<div style="font-size:12px">Title bonus: ${modList(TT[o.title])}</div>`:''}
  <div class="mut">A spirit confined here stays <b style="color:var(--ac)">${d.turns+(o.title==='Elder'?1:0)}</b> turns.${d.equip?' Can be equipped (grants '+SK[d.skill].n+').':''}</div>`;
}
function ui(){
  if (MODE==='hub') return hubUI();
  if (MODE==='chart') return chartUI();
  const h=host();
  $('#top').innerHTML = `<span class="chip">${STAGE.name}</span><span class="chip">Turn <b>${G.turn}</b></span>
    <span class="chip">${G.phase==='player'?'Your phase':'Enemy phase'}</span><span class="sp"></span>
    <span class="chip">Confine <b>${G.confLeft}</b>/${STAGE.conf}</span><span class="chip">Foes <b>${units('e').length}</b></span>
    <button id="help" style="padding:3px 9px">?</button>`;
  $('#help').onclick = showHelp;
  const P=[], u=G.sel;
  if (G.phase!=='player'){P.push('<div class="mut">Enemy phase…</div>')}
  else if (G.pending){
    const o=G.pending, sp=G.pendingSpirit, prev=charUnit(sp,{team:'p'}); prev.obj=o; prev.hp=stat(prev,'hp'); prev.sp=maxSP(prev);
    P.push(`<div class="mut">Preview: ${sp.name} confined into ${o.title?o.title+' ':''}${OT[o.type].n}</div>`+unitInfo({...prev,turns:OT[o.type].turns+(o.title==='Elder'?1:0)}));
    P.push(`<div class="row"><button class="pri" data-a="doConf">Confine here</button><button data-a="cancel">Pick another</button></div>`);
  }
  else if (u && u.k==='unit'){
    P.push(unitInfo(u));
    if (u.team==='p' && alive(u)){
      const dis = busy||!!u.liftedBy;
      const row=[];
      row.push(`<button data-a="move" ${dis||u.mvLeft<5||u.acted&&u.mvLeft<5?'disabled':''}>Move <span class="mut">${Math.round(u.mvLeft)}</span></button>`);
      for (const k of skills(u)){const s=SK[k];row.push(`<button data-a="sk:${k}" ${dis||u.acted||u.lift||u.sp<s.sp?'disabled':''}>${s.n}${s.sp?` <span class="mut">${s.sp}SP</span>`:''}</button>`)}
      if (Object.values(SAVE.bag).some(n=>n>0)) row.push(`<button data-a="item" ${dis||u.acted||u.lift?'disabled':''}>Item</button>`);
      if (u.lift) row.push(`<button data-a="throw" ${dis||u.acted?'disabled':''}>Throw</button>`);
      else row.push(`<button data-a="lift" ${dis||u.acted?'disabled':''}>Lift</button>`);
      const nearW = objs().some(o=>OT[o.type].equip&&!o.liftedBy&&dist(u.x,u.y,o.x,o.y)<=REACH+o.r);
      if (nearW) row.push(`<button data-a="equip" ${dis?'disabled':''}>Equip</button>`);
      if (u.host) row.push(`<button class="gold" data-a="confine" ${busy||!G.confLeft?'disabled':''}>Confine</button>`);
      row.push(`<button data-a="done" ${dis||(u.acted&&u.mvLeft<5)?'disabled':''}>Wait</button>`);
      P.push('<div class="row">'+row.join('')+'</div>');
    }
  }
  else if (u && u.k==='obj'){P.push(objInfo(u))}
  else {
    P.push(`<div class="mut">Tap <b style="color:var(--gd)">${h?h.name:'your Warden'}</b> to confine spirits into objects on the field. Tap a unit to command it, or an object to see what it gives. Drag to look around.</div>`);
  }
  const modeHint={move:'Tap where to move (inside the blue circle).',skill:'Tap a target in range.',lift:'Tap something next to you to lift it.',
    throw:'Tap where to throw. Outside the island = out of bounds!',equip:'Tap a weapon next to you.',useItem:'Tap yourself or an ally next to you.',confObj:'Tap an object inside the purple circle.'}[G.mode];
  if (modeHint && !G.pending) P.push(`<div class="hint">${modeHint} <button data-a="cancel" style="padding:3px 8px;margin-left:6px">Cancel</button></div>`);
  if (G.flash) P.push(`<div class="hint" style="border-color:#8a4656;background:#3a1f28">${G.flash}</div>`);
  if (G.phase==='player') P.push(`<div class="row"><button class="warn" data-a="end" ${busy?'disabled':''}>End Phase</button>${u&&G.sel!==h&&h?`<button data-a="selHost">Select ${h.name}</button>`:''}</div>`);
  P.push(`<div id="log">${G.log.slice(0,3).join('<br>')}</div>`);
  $('#panel').innerHTML = P.join('');
}
$('#panel').addEventListener('click', e => {
  const b=e.target.closest('button[data-a]'); if(!b||b.disabled) return;
  const a=b.dataset.a, u=G.sel;
  if (a==='end'){G.mode='idle';G.pending=null;enemyPhase();return}
  if (a==='cancel'){G.mode='idle';G.pending=null;ui();return}
  if (a==='selHost'){G.sel=host();G.mode='idle';focus(G.sel);ui();return}
  if (a==='move') G.mode='move';
  else if (a.startsWith('sk:')){G.mode='skill';G.skill=a.slice(3)}
  else if (a==='lift') G.mode='lift';
  else if (a==='throw') G.mode='throw';
  else if (a==='equip') G.mode='equip';
  else if (a==='done'){u.acted=true;u.mvLeft=0;G.mode='idle';G.sel=null}
  else if (a==='confine'){openRoster();return}
  else if (a==='item'){openBag();return}
  else if (a==='doConf'){const sp=G.pendingSpirit,o=G.pending;G.pending=null;G.mode='idle';const nu=confine(sp,o);G.sel=nu}
  ui();
});

function showHelp(){
  $('#ovIn').innerHTML = `<h2>How to play</h2>
  <p><b>Confine:</b> your Warden fights alone. Select them, tap <b>Confine</b>, pick a spirit, then tap an object nearby. The spirit takes that object's stat bonuses and its title. Each battle has a limited number of confines.</p>
  <p><b>Turn limit:</b> spirits only last a few turns (rocks last long, flowers short). When time runs out they leave and the object is used up.</p>
  <p><b>Free movement:</b> no grid. Move anywhere inside your blue circle; you can split movement before and after acting.</p>
  <p><b>Lift & throw:</b> lift objects, allies or foes next to you, then throw them. Anything that lands outside the island is out of bounds and gone. Knockback can push foes off too.</p>
  <p><b>Steal:</b> rogues can take the item a foe is holding, which removes its bonus from them.</p>
  <p><b>Equip:</b> pick up weapons on the field for a new skill and stats. Items held at the end of the battle are kept.</p>
  <div class="row"><button class="pri" id="hc">Got it</button></div>`;
  $('#ov').classList.add('on'); $('#hc').onclick=()=>{$('#ov').classList.remove('on');if(G.over)showEnd()};
}

const mkDecor = () => Array.from({length:70},(_,i)=>{const a=Math.sin(i*12.9898)*43758.5453,b=Math.sin(i*78.233)*12345.678;return [40+(a-Math.floor(a))*500,40+(b-Math.floor(b))*450,i%3]}).filter(([x,y])=>inIsland(x,y,10));

const STARS = Array.from({length:60},(_,i)=>[(Math.sin(i*3.1)*0.5+0.5),(Math.sin(i*7.7)*0.5+0.5),(i%4)/4]);
function polyPath(poly,dy=0){cx.beginPath();poly.forEach(([x,y],i)=>{const[sx,sy]=w2s(x,y);i?cx.lineTo(sx,sy+dy*cam.z):cx.moveTo(sx,sy+dy*cam.z)});cx.closePath()}
function ell(x,y,r,stroke,fill,lw=2,dash){const[sx,sy]=w2s(x,y);cx.beginPath();cx.ellipse(sx,sy,r*cam.z,r*VS*cam.z,0,0,6.283);if(fill){cx.fillStyle=fill;cx.fill()}if(stroke){cx.setLineDash(dash||[]);cx.lineWidth=lw;cx.strokeStyle=stroke;cx.stroke();cx.setLineDash([])}}

  cx.fillStyle='rgba(255,255,255,.5)';for(const[a,b,c]of STARS)cx.fillRect(a*cw,b*ch,1+c,1+c);

    else if (f.type==='ring'){ell(f.x,f.y,f.r*f.t,'#bfe8ff','rgba(160,220,255,'+(0.35*(1-f.t))+')',3)}
    else if (f.type==='txt'){const t=(now-f.t0)/f.ms;if(t>=1){fx.splice(i,1);continue}const[sx,sy]=w2s(f.x,f.y,40+t*30);
      cx.globalAlpha=1-t*t;cx.font=`bold ${Math.round(14*Math.max(cam.z,.8))}px system-ui`;cx.textAlign='center';cx.lineWidth=3;cx.strokeStyle='#000';cx.strokeText(f.s,sx,sy);cx.fillStyle=f.col;cx.fillText(f.s,sx,sy);cx.globalAlpha=1}

function drawEnt(e,h,carrier){
  const x=carrier?carrier.x:e.x, y=carrier?carrier.y:e.y, z=cam.z;
  let [sx,sy]=w2s(x,y,h+(e.air||0));
  const [gx,gy]=w2s(x,y);
  if (e.falling!=null){sy+=e.falling*120*z;cx.globalAlpha=1-e.falling}
  if (!carrier){cx.fillStyle='rgba(0,0,0,.28)';cx.beginPath();cx.ellipse(gx,gy,e.r*z,e.r*VS*z*0.8,0,0,6.283);cx.fill()}
  if (e.k==='obj') drawObj(e,sx,sy,z); else drawUnit(e,sx,sy,z);
  cx.globalAlpha=1;
}
function drawObj(o,sx,sy,z){

  else if (t==='tree'){cx.fillStyle='#6b4a2e';cx.fillRect(sx-3*z,sy-22*z,6*z,22*z);for(const[dx,dy,r,c]of[[0,-34,13,'#2f6b34'],[-8,-28,9,'#3a7d3e'],[8,-28,9,'#3a7d3e'],[0,-40,8,'#4a9450']]){cx.fillStyle=c;cx.beginPath();cx.arc(sx+dx*z,sy+dy*z,r*z,0,6.283);cx.fill()}}
  else if (t==='flower'){cx.strokeStyle='#3f8a3a';cx.lineWidth=2*z;cx.beginPath();cx.moveTo(sx,sy);cx.lineTo(sx,sy-10*z);cx.stroke();for(let a=0;a<5;a++){cx.fillStyle='#d9c8ff';cx.beginPath();cx.arc(sx+Math.cos(a*1.256)*4*z,sy-12*z+Math.sin(a*1.256)*4*z,2.6*z,0,6.283);cx.fill()}cx.fillStyle='#ffe27a';cx.beginPath();cx.arc(sx,sy-12*z,2*z,0,6.283);cx.fill()}
  else if (t==='barrel'){cx.fillStyle='#8a5a32';cx.beginPath();cx.roundRect(sx-9*z,sy-20*z,18*z,20*z,4*z);cx.fill();cx.fillStyle='#4a3020';cx.fillRect(sx-9*z,sy-16*z,18*z,2*z);cx.fillRect(sx-9*z,sy-6*z,18*z,2*z)}
  else drawWeapon(t,sx,sy-8*z,z,true);
  if (o.title){cx.fillStyle='#f2c85b';cx.font=`bold ${Math.round(10*z)}px system-ui`;cx.textAlign='center';cx.fillText('★',sx+11*z,sy-14*z)}
}
function drawWeapon(t,sx,sy,z,ground){

  if (t==='sword'){cx.strokeStyle='#dfe6ef';cx.lineWidth=3*z;cx.beginPath();cx.moveTo(0,-12*z);cx.lineTo(0,6*z);cx.stroke();cx.strokeStyle='#b08a3e';cx.beginPath();cx.moveTo(-4*z,3*z);cx.lineTo(4*z,3*z);cx.stroke()}
  if (t==='bow'){cx.strokeStyle='#a07040';cx.lineWidth=2.5*z;cx.beginPath();cx.arc(0,0,9*z,-1.3,1.3);cx.stroke();cx.strokeStyle='#ddd';cx.lineWidth=1;cx.beginPath();cx.moveTo(Math.cos(-1.3)*9*z,Math.sin(-1.3)*9*z);cx.lineTo(Math.cos(1.3)*9*z,Math.sin(1.3)*9*z);cx.stroke()}
  if (t==='axe'){cx.strokeStyle='#8a6a40';cx.lineWidth=2.5*z;cx.beginPath();cx.moveTo(0,10*z);cx.lineTo(0,-12*z);cx.stroke();cx.fillStyle='#c9d2dc';cx.beginPath();cx.moveTo(0,-12*z);cx.quadraticCurveTo(9*z,-12*z,8*z,-3*z);cx.lineTo(0,-6*z);cx.closePath();cx.fill()}

function drawUnit(u,sx,sy,z){

  else if (enemy && u.cls==='Hexcap'){cx.fillStyle='#e8dcc0';cx.fillRect(sx-5*z,sy-14*z,10*z,14*z);cx.fillStyle=c.col;cx.beginPath();cx.ellipse(sx,sy-16*z,13*z,8*z,0,Math.PI,0);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(sx-5*z,sy-19*z,2*z,0,6.283);cx.arc(sx+4*z,sy-21*z,1.6*z,0,6.283);cx.fill();eyes(sx,sy-9*z,z,'#222')}

  else {

    cx.fillStyle='#2a2a33';cx.fillRect(sx-3*z,sy-27*z,1.6*z,2*z);cx.fillRect(sx+1.6*z,sy-27*z,1.6*z,2*z);
    const k=u.cls;
    if (k==='Witch'){cx.fillStyle='#5b3a8a';cx.beginPath();cx.moveTo(sx-9*z,sy-30*z);cx.lineTo(sx+9*z,sy-30*z);cx.lineTo(sx+2*z,sy-44*z);cx.fill()}
    if (k==='Archer'){cx.fillStyle='#3f7a46';cx.beginPath();cx.arc(sx,sy-28*z,7*z,Math.PI,0);cx.fill()}
    if (k==='Soldier'){cx.fillStyle='#9aa3b0';cx.beginPath();cx.arc(sx,sy-28*z,7*z,Math.PI,0);cx.fill();cx.fillRect(sx-7*z,sy-29*z,14*z,2*z)}
    if (k==='Healer'){cx.fillStyle='#e05a5a';cx.fillRect(sx-1.5*z,sy-17*z,3*z,9*z);cx.fillRect(sx-4.5*z,sy-14*z,9*z,3*z)}

    if (k==='Warden'){cx.fillStyle='#4a3a6a';cx.beginPath();cx.arc(sx,sy-28*z,7*z,Math.PI,0);cx.fill();cx.fillStyle='#ffe27a';cx.beginPath();cx.arc(sx+10*z,sy-10*z,3*z,0,6.283);cx.fill();cx.strokeStyle='#ffe27a';cx.globalAlpha*=.35;cx.beginPath();cx.arc(sx+10*z,sy-10*z,6*z,0,6.283);cx.stroke();cx.globalAlpha/=.35}

function eyes(sx,sy,z,col){cx.fillStyle=col;cx.beginPath();cx.arc(sx-3.5*z,sy,1.8*z,0,6.283);cx.arc(sx+3.5*z,sy,1.8*z,0,6.283);cx.fill()}

// Seeded random so a stage always generates the same island.
function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const TITLE_POOL = ['Sturdy','Fierce','Swift','Sage','Hardy','Elder','Frail','Champion'];
// Builds an island, scatters objects on the west side and puts foes on the east side.
function genStage(d){
  const R = rng(d.seed), pick = a => a[Math.floor(R()*a.length)];
  const cxp = 290, cyp = 265, island = [];
  for (let i=0;i<12;i++){const a=i/12*6.283+R()*0.2, r=215+R()*45; island.push([Math.round(cxp+Math.cos(a)*r*1.05),Math.round(cyp+Math.sin(a)*r*0.95)])}
  const placed = [];
  const spot = (x0,x1,minD) => {
    for (let t=0;t<400;t++){
      const x=x0+R()*(x1-x0), y=cyp-200+R()*400;
      if (!pip(x,y,island)) continue;
      let ok=true; for (let a=0;a<6.28;a+=0.785) if(!pip(x+Math.cos(a)*24,y+Math.sin(a)*24,island)) ok=false;
      if (ok && placed.every(([px,py])=>dist(x,y,px,py)>=minD)){placed.push([x,y]);return [Math.round(x),Math.round(y)]}
    }
    return null;
  };
  const host = spot(cxp-210,cxp-120,40) || [cxp-150,cyp];
  const objs = [];
  const kinds = ['rock','rock','rock','tree','tree','flower','flower','barrel','barrel'];
  for (let i=0;i<d.objs;i++){const p=spot(cxp-230,cxp+90,42);if(p)objs.push([pick(kinds),p[0],p[1],R()<0.35?pick(TITLE_POOL):''])}
  for (const w of ['sword','bow','staff'].sort(()=>R()-0.5).slice(0,d.weapons)){const p=spot(cxp-150,cxp+60,40);if(p)objs.push([w,p[0],p[1],R()<0.5?pick(TITLE_POOL):''])}
  const foes = [];
  for (let i=0;i<d.foes;i++){
    const p=spot(cxp+40,cxp+260,38); if(!p) continue;
    const cls=pick(d.pool), lv=Math.max(1,d.lv-1+Math.floor(R()*3));
    const f={name:cls==='GrubKnight'?'Grub Knight':cls,cls,lv,x:p[0],y:p[1]};
    if (R()<0.3) f.title=pick(TITLE_POOL);
    if (R()<0.25){f.held=pick(['sword','bow','staff']);if(R()<0.5)f.heldTitle=pick(TITLE_POOL)}
    foes.push(f);
  }
  const bp = spot(cxp+120,cxp+270,38);
  if (bp) foes.push({name:d.boss,cls:'GrubKnight',lv:d.lv+2,x:bp[0],y:bp[1],title:pick(['Champion','Elder','Sturdy']),held:pick(['sword','staff']),heldTitle:pick(TITLE_POOL),boss:1});
  return {...d, island, host:{x:host[0],y:host[1]}, objs, foes};
}

const expNeed = lv => Math.round(20*Math.pow(lv,1.5));
function expFor(src,e){return Math.max(1,Math.round(12*e.lv*(e.boss?3:1)*clamp(1+(e.lv-src.lv)*0.15,0.3,2)))}
function giveExp(src,e){
  if (!src || src.team!=='p' || e.team!=='e' || src.rid==null) return;

  popup(src.x,src.y-16,'+'+g+' EXP','#bfeaff');
}
function applyExp(win){
  const ups = [], bonus = win ? STAGE.lv*8 : 0;
  for (const id of [0,...Object.keys(G.used).map(Number)]){
    const c = id===0 ? SAVE.host : SAVE.roster.find(r=>r.id===id);
    if (!c) continue;
    const gain = (G.exp[id]||0)+bonus, from = c.lv;
    c.exp = (c.exp||0)+gain;
    while (c.exp>=expNeed(c.lv)){c.exp-=expNeed(c.lv);c.lv++}
    if (gain) ups.push({name:c.name,gain,from,to:c.lv});
  }
  if (win) SAVE.cleared[STAGE.id] = 1;
  save();
  return ups;
}

// Everything that can carry a title: characters, their items, items in storage.
function titleHolders(){
  const L=[{lab:`${SAVE.host.name} <span class="mut">Warden</span>`,o:SAVE.host}];
  for (const r of SAVE.roster) L.push({lab:`${r.name} <span class="mut">Lv ${r.lv} ${r.cls}</span>`,o:r});

function openTitles(){

    if (c!==SAVE.host) body+=HS.rel?`<div class="hint">Release ${c.name}? They leave the island for good.${c.item?' Their item goes to storage.':''} <div class="row"><button class="warn" data-h="release2">Release</button><button data-h="norel">Keep</button></div></div>`
      :`<div class="row"><button class="warn" data-h="release">Release…</button></div>`;

function hubAct(a,d){
  const chars=[SAVE.host,...SAVE.roster];
  switch(a){
    case 'talk': return openBuilding(H.near);
    case 'go': return openBuilding(BLD.find(b=>b.id===d.v));
    case 'roster': case 'items': HS={b:BLD.find(b=>b.id==='house'),sel:null,rel:false}; return openHouse();
    case 'save': save(); return hubMsg('Game saved.');
    case 'cls': HS.cls=d.v; return openSoul();
    case 'rname': HS.name=randomName(); return openSoul();
    case 'lv-': HS.lv=Math.max(1,HS.lv-1); return openSoul();
    case 'lv+': HS.lv=Math.min(maxCreateLv(),HS.lv+1); return openSoul();
    case 'create': {
      const name=(HS.name||'').trim().slice(0,12), cost=createCost(HS.cls,HS.lv);
      if (!name){return hubMsg('Give them a name first.')}
      if (SAVE.gold<cost||SAVE.roster.length>=ROSTER_MAX) return;
      const r={id:SAVE.nid++,name,cls:HS.cls,lv:HS.lv,title:'',item:null};
      SAVE.roster.push(r); SAVE.gold-=cost; save();
      const [x,y]=door(HS.b); H.spirits.push({r,x,y:y+10,tx:x,ty:y+10,wait:0});
      HS.name=randomName(); openSoul(); return hubMsg(`${name} the ${r.cls} joins your island!`);
    }
    case 'tsrc': HS.src=titleHolders()[+d.i].o; return openTitles();
    case 'tdst': HS.dst=titleHolders()[+d.i].o; return openTitles();
    case 'tback': if (HS.dst) HS.dst=null; else HS.src=null; return openTitles();
    case 'tmove': {
      if (SAVE.gold<TITLE_COST) return;
      const t=HS.src.title; HS.dst.title=t; HS.src.title=''; SAVE.gold-=TITLE_COST; save();
      HS.src=HS.dst=null; openTitles(); return hubMsg(`★ ${t} moved.`);
    }
    case 'char': HS.sel=+d.i; HS.rel=false; return openHouse();
    case 'hback': HS.sel=null; return openHouse();
    case 'unequip': {const c=chars[HS.sel]; SAVE.items.push(c.item); c.item=null; save(); return openHouse()}
    case 'equip': {const c=chars[HS.sel], it=SAVE.items.splice(+d.i,1)[0]; if(c.item) SAVE.items.push(c.item); c.item=it; save(); return openHouse()}
    case 'release': HS.rel=true; return openHouse();
    case 'norel': HS.rel=false; return openHouse();
    case 'release2': {
      const c=chars[HS.sel]; if (c.item) SAVE.items.push(c.item);
      SAVE.roster.splice(SAVE.roster.indexOf(c),1); H.spirits=H.spirits.filter(s=>s.r!==c); save();
      HS.sel=null; HS.rel=false; openHouse(); return hubMsg(`${c.name} has left the island.`);
    }
    case 'stab': case 'ssel': case 'q-': case 'q+': case 'buy': case 'buyeq': case 'sell': case 'sellc': return shopAct(a,d);
    case 'sail': return startBattle(STAGES[C.sel]);
    case 'clist': C.list=!C.list; return chartUI();
    case 'cback': return closeChart();
  }
}

const PRICE = {sword:240,axe:320,spear:280,bow:260,staff:300};
const STOCK = ['sword','axe','spear','bow','staff','herb','tonic'];
const sellPrice = it => Math.floor((PRICE[it.type]||100)/2*(it.title?1.5:1));
const ICON = {

  tonic:'<svg width="30" height="30" viewBox="0 0 30 30"><rect x="12" y="4" width="6" height="5" fill="#ccc"/><path d="M10 9 h10 l2 15 q0 3 -3 3 h-8 q-3 0 -3 -3z" fill="#7fa8ff"/></svg>',
};
const TRADER_SVG = `<svg width="84" height="84" viewBox="0 0 90 90" style="flex:none"><ellipse cx="45" cy="86" rx="28" ry="4" fill="#0005"/><rect x="24" y="44" width="42" height="40" rx="10" fill="#c98a3a"/><circle cx="45" cy="32" r="16" fill="#f1d3b8"/><path d="M27 28 q18 -26 36 0z" fill="#3a6a5a"/><rect x="25" y="26" width="40" height="5" fill="#2a5a4a"/><circle cx="39" cy="33" r="2" fill="#333"/><circle cx="51" cy="33" r="2" fill="#333"/><path d="M38 41 q7 5 14 0" stroke="#7a4a3a" stroke-width="2" fill="none"/><rect x="10" y="66" width="70" height="20" fill="#7a5a3a"/></svg>`;
const itemLine = t => CONS[t] ? CONS[t].d+' · use in battle' : Object.entries(OT[t].equip).map(([k,v])=>SL[k]+' '+(v>0?'+':'−')+Math.abs(v)).join(' ')+' · '+SK[OT[t].skill].n;
const isCaster = c => c.cls==='Witch' || c.cls==='Healer';
// How each character would change if they held a new weapon of type t, best match first.
function whoGains(t){
  const chars = [SAVE.host,...SAVE.roster];
  return chars.map((c,i)=>{
    const a = charUnit(c,{team:'p'}), b = charUnit({...c,item:{type:t,title:''}},{team:'p'});
    const d = ['atk','int','spd','def','mv'].map(k=>[k,stat(b,k)-stat(a,k)]).filter(([,v])=>v);
    const gain = skills(b).filter(k=>!skills(a).includes(k));
    const da = stat(b,'atk')-stat(a,'atk'), di = stat(b,'int')-stat(a,'int');
    return {c,i,d,gain,score:isCaster(c)?di+da*0.2:da+di*0.2,main:stat(b,isCaster(c)?'int':'atk')};
  }).sort((x,y)=>(y.score-x.score)||(y.main-x.main));
}
function openShop(){
  const P = [`<div class="row" style="align-items:flex-end;flex-wrap:nowrap">${TRADER_SVG}<div class="speech">${HS.say}</div></div>`,
    `<div class="row"><button data-h="stab" data-v="buy" class="${HS.tab==='buy'?'on':''}">Buy</button><button data-h="stab" data-v="sell" class="${HS.tab==='sell'?'on':''}">Sell</button><span style="flex:1"></span><span class="mut">You have <b class="gd">${SAVE.gold.toLocaleString()}</b> Bordin</span></div>`];
  if (HS.tab==='buy'){
    for (const k of STOCK){
      const name = CONS[k]?CONS[k].n:OT[k].n, price = CONS[k]?CONS[k].price:PRICE[k], sel = HS.sel===k;
      P.push(`<div class="card" data-h="ssel" data-v="${k}" style="${sel?'border-color:var(--gd)':''}"><div class="ibox">${ICON[k]}</div><div class="tx"><b>${name}</b><div class="mut">${itemLine(k)}</div></div><b class="gd">${price}</b></div>`);
      if (!sel) continue;
      if (CONS[k]){
        const cost = price*HS.qty;
        P.push(`<div class="detail"><div class="mut">You have ${SAVE.bag[k]||0}. Any character can use it on themselves or an ally next to them, instead of attacking.</div>
          <div class="row"><button data-h="q-" ${HS.qty<=1?'disabled':''}>−</button><b style="min-width:30px;text-align:center">${HS.qty}</b><button data-h="q+">+</button>
          <button class="pri" style="flex:1" data-h="buy" ${SAVE.gold<cost?'disabled':''}>Buy ${HS.qty} for ${cost}</button></div></div>`);
      } else {
        const rows = whoGains(k).map(w=>`<div class="who"><i style="background:${CL[w.c.cls].col}"></i><div style="flex:1;min-width:0"><b>${w.c.name}</b> <span class="mut">${w.c.cls}${w.c.item?' · holds '+itemName(w.c.item):''}</span>
          <div>${w.d.map(([s,v])=>`<span class="${v>0?'up':'dn'}">${SL[s]} ${v>0?'+':'−'}${Math.abs(v)}</span>`).join(' ')||'<span class="mut">no change</span>'}${w.gain.length?` <span class="ttl">+${w.gain.map(g=>SK[g].n).join(', ')}</span>`:''}</div></div>
          <button data-h="buyeq" data-i="${w.i}" ${SAVE.gold<price?'disabled':''}>Equip</button></div>`).join('');
        P.push(`<div class="detail"><div class="mut">A spirit confined into it gets ${modList(OT[k].mods)}. If equipped on…</div>${rows}
          <div class="row"><button class="pri" style="flex:1" data-h="buy" ${SAVE.gold<price?'disabled':''}>Buy for ${price} (to storage)</button></div></div>`);
      }
    }
  } else {
    const bagKeys = Object.keys(CONS).filter(k=>SAVE.bag[k]>0);
    if (!SAVE.items.length && !bagKeys.length) P.push('<p class="mut">Nothing to sell. Equipped items have to be unequipped at your house first.</p>');
    SAVE.items.forEach((it,i)=>P.push(`<div class="card"><div class="ibox">${ICON[it.type]}</div><div class="tx"><b>${OT[it.type].n}</b>${it.title?` <span class="ttl">★ ${it.title}</span>`:''}<div class="mut">${itemLine(it.type)}</div></div><button data-h="sell" data-i="${i}">Sell ${sellPrice(it)}</button></div>`));
    for (const k of bagKeys) P.push(`<div class="card"><div class="ibox">${ICON[k]}</div><div class="tx"><b>${CONS[k].n}</b> <span class="mut">×${SAVE.bag[k]}</span><div class="mut">${CONS[k].d}</div></div><button data-h="sellc" data-v="${k}">Sell 1 for ${Math.floor(CONS[k].price/2)}</button></div>`);
    if (SAVE.items.length) P.push('<p class="mut">Titled items sell for 50% more. Equipped items have to be unequipped at your house first.</p>');
  }
  $('#sheetIn').innerHTML = `<h2>Trader</h2>${P.join('')}<div class="row"><button data-x="close">Close</button></div>`;
  $('#sheet').classList.add('on');
  hubUI();
}
function shopAct(a,d){
  const k = HS.sel;
  if (a==='stab'){HS.tab=d.v}
  else if (a==='ssel'){HS.sel=d.v;HS.qty=1}
  else if (a==='q-') HS.qty=Math.max(1,HS.qty-1);
  else if (a==='q+') HS.qty=Math.min(99,HS.qty+1);
  else if (a==='buy'){
    const cost = CONS[k] ? CONS[k].price*HS.qty : PRICE[k];
    if (SAVE.gold<cost){HS.say='Come back with more Bordin, friend.'}
    else {
      SAVE.gold -= cost;
      if (CONS[k]) SAVE.bag[k] = (SAVE.bag[k]||0)+HS.qty; else SAVE.items.push({id:SAVE.nid++,type:k,title:''});
      HS.say = CONS[k] ? `${HS.qty} ${CONS[k].n}${HS.qty>1?'s':''}, coming right up.` : `One ${OT[k].n}. It's in your storage.`;
      save();
    }
  }
  else if (a==='buyeq'){
    const c = [SAVE.host,...SAVE.roster][+d.i];
    if (SAVE.gold<PRICE[k]){HS.say='Come back with more Bordin, friend.'}
    else {SAVE.gold-=PRICE[k]; if(c.item) SAVE.items.push(c.item); c.item={id:SAVE.nid++,type:k,title:''}; HS.say=`${c.name} looks good with that ${OT[k].n}.`; save()}
  }
  else if (a==='sell'){const it=SAVE.items.splice(+d.i,1)[0]; if(it){SAVE.gold+=sellPrice(it); HS.say=`I'll find that ${OT[it.type].n} a good home.`; save()}}
  else if (a==='sellc'){if(SAVE.bag[d.v]>0){SAVE.bag[d.v]--; SAVE.gold+=Math.floor(CONS[d.v].price/2); HS.say='Always happy to restock.'; save()}}
  openShop();
}

function openBag(){
  const keys = Object.keys(CONS).filter(k=>SAVE.bag[k]>0);
  $('#sheetIn').innerHTML = `<h2>Use an item</h2><div class="mut">Pick one, then tap ${G.sel.name} or an ally next to them. Using an item takes this unit's action.</div>`+
    keys.map(k=>`<div class="card" data-u="${k}"><div class="ibox">${ICON[k]}</div><div class="tx"><b>${CONS[k].n}</b> <span class="mut">×${SAVE.bag[k]}</span><div class="mut">${CONS[k].d}</div></div></div>`).join('')+
    `<div class="row"><button data-x="close">Close</button></div>`;
  $('#sheet').classList.add('on');
}
async function useItem(u,t,k){
  const c = CONS[k]; if (!SAVE.bag[k]) return;
  SAVE.bag[k]--; save(); u.acted = true;
  if (c.hp){const n=Math.min(c.hp,stat(t,'hp')-t.hp); t.hp+=n; popup(t.x,t.y,'+'+n+' HP','#8dffa0')}
  if (c.sp){const n=Math.min(c.sp,maxSP(t)-t.sp); t.sp+=n; popup(t.x,t.y,'+'+n+' SP','#9fc4ff')}
  log(u.name+' used '+c.n+(t!==u?' on '+t.name:''));
  await wait(300);
}
// Units on the line from u towards (tx,ty), up to rng away, nearest first.
function lineHits(u,tx,ty,rng){
  const d = dist(u.x,u.y,tx,ty)||1, dx = (tx-u.x)/d, dy = (ty-u.y)/d;
  return units().filter(e=>{
    if (e===u || e.liftedBy) return false;
    const px = e.x-u.x, py = e.y-u.y, along = px*dx+py*dy, off = Math.abs(px*dy-py*dx);
    return along>0 && along<=rng+e.r && off<=e.r+6;
  }).sort((a,b)=>dist(u.x,u.y,a.x,a.y)-dist(u.x,u.y,b.x,b.y));
}

$('#panel').addEventListener('click', e => {if(MODE==='battle')return;const b=e.target.closest('[data-h]');if(b&&!b.disabled)hubAct(b.dataset.h,b.dataset)});
$('#chart').addEventListener('click', e => {const g=e.target.closest('[data-s]');if(!g)return;const i=+g.dataset.s;if(!unlocked(i))return;C.sel=i;chartUI()});
$('#sheet').addEventListener('input', e => {if(e.target.id==='cname')HS.name=e.target.value});

// ===================== BOOT =====================
window.addEventListener('resize',()=>{resize()});
// The panel height changes with its content, so re-measure the canvas whenever its box changes.
if (window.ResizeObserver) new ResizeObserver(()=>resize()).observe(cv);
resize(); SAVE = loadSave(); toHub(); requestAnimationFrame(draw);
</script>
